name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# The game app lives in client/; every `run:` step works from there.
defaults:
  run:
    working-directory: client

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          # No package.json at the root: the app lives in client/.
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Lint chay o day chu khong chi trong ci.yml: `build` bat duoc loi kieu
      # nhung khong bat vi pham lint, va mot push thang vao `main` khong di
      # qua pull request.
      - run: pnpm lint
      - run: pnpm test

      # The browser regression suite (automation-testing/) gates every pull
      # request in ci.yml; this workflow only runs after the merge.

      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Ducker ID sign-in is shipped dark: the flag and DUCKER_* vars are
          # deliberately not passed (docs/decisions/0001-ducker-id-sign-in.md).

      # Next puts every asset under _next/, and anything starting with an
      # underscore is invisible to Jekyll.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
